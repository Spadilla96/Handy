name: "Meeting Worker"

on:
  workflow_dispatch:
  push:
    paths:
      - "meeting-worker/**"
      - ".github/workflows/meeting-worker.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --manifest-path meeting-worker/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path meeting-worker/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: handy-meeting-worker
          path: meeting-worker/target/release/handy-meeting-worker.exe
